name: tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels that PR's older run, which no longer tests anything we'd merge. Each
# push to main gets its own group (its run id), because in a shared group GitHub keeps only one
# pending run and cancels the others even with cancel-in-progress off, so back-to-back merges would
# lose results. Every merge commit gets a full run (decision 95).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Once, on one OS: ruff's results don't depend on the platform (decision 94).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Same pin as pyproject.toml's dev extras (a test keeps them equal), so CI formats as a local run does.
      - run: python -m pip install "ruff==0.16.10"
      - run: ruff check .
      - run: ruff format --check .

  pytest:
    strategy:
      fail-fast: false
      matrix:
        # The full suite once per OS; the other Python versions run the fast set (`not slow`), which
        # skips the git-heavy lane tests that take minutes on Windows.
        include:
          - { os: windows-latest, python: "3.13", marks: "" }
          - { os: ubuntu-latest, python: "3.11", marks: "" }
          - { os: windows-latest, python: "3.11", marks: "not slow" }
          - { os: ubuntu-latest, python: "3.13", marks: "not slow" }
    name: pytest (${{ matrix.os }}, ${{ matrix.python }}${{ matrix.marks && ', fast set' || ', full' }})
    runs-on: ${{ matrix.os }}
    # A hung job otherwise holds a runner for GitHub's 6-hour default. The slowest job (Windows
    # full) takes ~4 minutes, so 10 leaves room for a slow runner without waiting long on a hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The setup command AGENTS.md documents, so a pyproject.toml that breaks it fails CI.
      - run: python -m pip install -e ".[dev]"
      # bash on every OS, so an empty -m "" (no filter: the full suite) is passed the same way.
      - run: python -m pytest -m "${{ matrix.marks }}"
        shell: bash
