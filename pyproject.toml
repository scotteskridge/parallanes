# Declared rather than left to pip's legacy fallback. 77 is the first setuptools that reads the
# SPDX string form of `license` below.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-lanes-starter"
version = "0.1.0.dev0"
description = "Starter kit for multi-lane Claude Code projects: instructions, skills, reviewer, hooks and parallel git-worktree lanes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Scott Eskridge" }]

[project.optional-dependencies]
# ruff is pinned exactly: its formatting changes between versions, and CI must agree with a local run.
dev = ["pytest>=8", "pytest-xdist>=3", "pyyaml>=6", "ruff==0.16.10"]

# No packages: the kit isn't distributed as one (the installer copies files into a project), so
# `pip install -e ".[dev]"` only needs the dev extras. Without this, setuptools' auto-discovery
# finds payload/ and installer/ side by side and refuses to guess.
[tool.setuptools]
packages = []

# Dev-only (decision 94): lints and formats the kit's own code; nothing here is installed.
[tool.ruff]
line-length = 120
target-version = "py311"
# Where the kit's own modules and test helpers live, so imports of them sort apart from pytest;
# found by folder, so a new helper needs no list update. "." holds the installer.
src = [".", "tests", "tests/live", "payload/kit-owned/.claude/kit"]

[tool.ruff.lint]
# BLE: a broad except needs an explicit `# noqa: BLE001`, which by convention says why (AGENTS.md:
# never swallow an exception);
# RUF100: a noqa that no longer suppresses anything is an error, so the reasons stay true.
select = ["E", "F", "W", "I", "B", "UP", "BLE", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto: tests run in parallel (pytest-xdist). Each test uses its own temp folders, so they can.
addopts = "-ra -n auto --strict-markers"
# Run with the .venv's python, not the one on PATH (AGENTS.md): the fast set while working
# (`-m pytest -m "not slow"`), the full suite before a commit or PR.
markers = [
    "slow: builds real repos, worktrees and CLI processes; seconds a test on Windows",
    "live: runs real claude -p sessions; skipped unless pytest runs with --live (docs/live-checks.md)",
]
