[project]
name = "claude-code-lanes-starter"
version = "0.1.0.dev0"
description = "Starter kit for multi-lane Claude Code projects: instructions, skills, reviewer, hooks and parallel git-worktree lanes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Scott Eskridge" }]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto: tests run in parallel (pytest-xdist). Each test uses its own temp folders, so they can.
addopts = "-ra -n auto --strict-markers"
# While working: `python -m pytest -m "not slow"`; before a commit or PR, the full suite (AGENTS.md).
markers = ["slow: builds real repos, worktrees and CLI processes; seconds a test on Windows"]
